<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Research report</title>
<style>
:root { --bg: #f4f6f5; --surface: #ffffff; --fg: #18201e; --muted: #56625e; --rule: #d6dcd9; --accent: #1d5f63; --warn: #8a5a00; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --surface: #171d1c; --fg: #e3e8e6; --muted: #9aa6a2; --rule: #2b3533; --accent: #6fb7b4; --warn: #e2b25a; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #111615; --surface: #171d1c; --fg: #e3e8e6; --muted: #9aa6a2; --rule: #2b3533; --accent: #6fb7b4; --warn: #e2b25a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 28px; }
h1 { font: 600 1.25rem/1.3 Georgia, serif; margin: 0 0 6px; }
p { margin: 0 0 18px; color: var(--muted); font-size: 0.92rem; }
label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 5px; background: var(--bg); color: var(--fg); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { margin-top: 14px; width: 100%; font: 600 0.95rem/1 inherit; padding: 11px; border: 0; border-radius: 5px;
  background: var(--accent); color: var(--surface); cursor: pointer; }
button:disabled { opacity: 0.6; cursor: progress; }
#msg { min-height: 1.4em; margin: 12px 0 0; font-size: 0.88rem; color: var(--warn); }
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256"},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser cannot decrypt the report (needs an https page)."; return; }
  btn.disabled = true; msg.textContent = "Decrypting…";
  let html;
  try { html = await unlock(document.getElementById("pw").value); }
  catch (err) { msg.textContent = "Wrong password."; btn.disabled = false; return; }
  document.open(); document.write(html); document.close();
});
